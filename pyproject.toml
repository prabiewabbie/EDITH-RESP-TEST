[project]
name = "gita-studio"
version = "0.1.0"
description = "Automated, scripture-faithful Bhagavad Gita content studio powered by Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "httpx2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
reels = ["pillow>=10", "numpy>=1.24", "edge-tts>=6", "opentimelineio>=0.17", "otio-fcp-adapter",
         "google-api-python-client>=2", "google-auth-oauthlib>=1"]

[project.scripts]
gita = "gita_studio.cli:main"
gita-reels = "gita_reels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gita_studio*", "gita_reels*"]

[tool.setuptools.package-data]
gita_reels = ["ui_static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
