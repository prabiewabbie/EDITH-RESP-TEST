# Gita Reels: fully animated 15-30 s vertical reels that follow the Bhagavad Gita storyline.
# Secrets come from env vars only: ANTHROPIC_API_KEY, FAL_KEY, YOUTUBE_TOKEN_JSON.

channel:
  name: "Echoes of Gita"
  handle: "@echoesofgita"

reel:
  min_seconds: 15
  max_seconds: 30
  fps: 24
  width: 1080
  height: 1920
  narration: false            # the reference is music-led; true adds an AI voice-over from the shot list
  voice: "en-IN-PrabhatNeural"
  verse_line: true            # show one exact verse line from verses.json when the episode's verse is there
  rotated_wide_shots: true    # allow the reference's sideways widescreen shot, at most one per reel
  codec: "h264"               # h264 (most compatible) | h265
  grade: "reference_warm"     # grade preset in style/cinematography.yaml
  match_shots: true           # even out colour between shots before grading

claude:
  model: "claude-opus-5-5"
  effort_write: "high"
  effort_review: "high"
  effort_qc: "medium"
  min_review_score: 8         # scripture fidelity and respect, 0-10
  min_qc_score: 7             # visual QC per shot, 0-10

fal:
  # Every model ID and field name is configurable. Run `gita-reels check-models` on your machine
  # to compare them against fal's live API schema before spending anything.
  keyframe_model: "fal-ai/nano-banana-2/edit"   # image model that takes character reference images
  keyframe_refs_field: "image_urls"
  refs_model: "fal-ai/nano-banana-2"             # text-to-image, used once to make character sheets
  # Video models, tried in order: the next is used only if one errors. Cheapest acceptable first.
  # Prices are from fal's published pages (October 2026); the budget caps use them. Field names for the
  # first two are not yet confirmed against fal's live schema: run `gita-reels check-models` once.
  video_models:
    # Seedance 2.0 (checked against fal's live schema, October 2026): 4-15 s, 480p/720p, no negative_prompt or
    # seed field, synced sound at no extra cost. Shots pick one with their `model` field; otherwise the chain
    # starts with v1.5 pro below.
    - id: "bytedance/seedance-2.0/mini/image-to-video"
      note: "$0.1547/s at 720p, audio included"
      price_per_second: 0.1547
      durations: [4, 5, 6, 7, 8, 9, 10, 11, 12]
      duration_format: "{n}"
      resolution: "720p"
      native_audio: true
      style: "veo"
      aspect_ratios: ["9:16", "16:9", "1:1"]
      chain: false                               # used only when a shot names it
    - id: "bytedance/seedance-2.0/fast/image-to-video"
      note: "$0.2419/s at 720p, audio included"
      price_per_second: 0.2419
      durations: [4, 5, 6, 7, 8, 9, 10, 11, 12]
      duration_format: "{n}"
      resolution: "720p"
      native_audio: true
      style: "veo"
      aspect_ratios: ["9:16", "16:9", "1:1"]
      chain: false
    - id: "fal-ai/bytedance/seedance/v1.5/pro/image-to-video"
      note: "about $0.10 per 4 s clip at 720p without audio (token-billed)"
      price_per_second: 0.025
      durations: [4, 5, 6]
      duration_format: "{n}"
      resolution: "720p"
      native_audio: false
      style: "veo"
      aspect_ratios: ["9:16", "16:9", "1:1"]
    - id: "fal-ai/wan-pro/image-to-video"
      note: "$0.16 per clip, 1080p, up to 6 s"
      price_per_video: 0.16
      durations: [5]
      omit: ["duration", "resolution", "aspect_ratio"]
      style: "kling"
    - id: "fal-ai/veo3.1/fast/image-to-video"
      note: "premium fallback: $0.10/s without audio, $0.15/s with audio"
      price_per_second: 0.10
      durations: [4, 6, 8]
      duration_format: "{n}s"
      resolution: "720p"
      native_audio: false                        # true adds ambient sound as a stem but costs $0.15/s
      style: "veo"
      negative_prompt: false                     # set true only if check-models lists negative_prompt
      aspect_ratios: ["9:16", "16:9"]
    # Other options seen on fal: fal-ai/kling-video/v2.5-turbo/pro/image-to-video ($0.07/s, 5 or 10 s),
    # fal-ai/ltx-2-19b/distilled/image-to-video ($0.0018 per megapixel of output).
  keyframe_price: 0.08
  music_model: "fal-ai/elevenlabs/music"         # composition plan per cue-sheet beat; $0.60 per started minute
  music_price: 0.6
  daily_budget_usd: 15
  reel_budget_usd: 8
  max_retries_per_shot: 2
  poll_seconds: 5
  timeout_seconds: 900

local:
  # Free alternative to fal: your own command per shot (e.g. an open-weight video model on your GPU).
  # Placeholders: {image} {prompt_file} {negative_file} {seconds} {aspect} {width} {height} {fps} {out}
  video_command: ""
  # Optional keyframe command. Placeholders: {prompt_file} {refs} {aspect} {width} {height} {out}
  image_command: ""
  durations: [3, 4, 5]

publish:
  auto_publish: true           # autopilot uploads every reel that passes all automated checks
  privacy: "public"            # public | unlisted | private. YouTube keeps uploads private until your API project passes its audit
  platforms: ["youtube"]

paths:
  verses: "data/verses.json"
  style: "style"
  music: "music"               # licensed or royalty-free tracks; filename words are used as mood tags
  sfx: "sfx"
  out: "reels"
  cache: ".cache/fal"
  state: "reels_state.json"
  queue: "queue"               # reviewed plans from the scheduled Claude Code task (docs/ROUTINE.md)
