# Gita Reels: fully animated 15-30 s vertical reels that follow the Bhagavad Gita storyline.
# Secrets come from env vars only: ANTHROPIC_API_KEY, FAL_KEY, YOUTUBE_TOKEN_JSON.

channel:
  name: "Echoes of Gita"
  handle: "@echoesofgita"

reel:
  min_seconds: 15
  max_seconds: 30
  fps: 24
  width: 1080
  height: 1920
  narration: false            # the reference is music-led; true adds an AI voice-over from the shot list
  voice: "en-IN-PrabhatNeural"
  verse_line: true            # show one exact verse line from verses.json when the episode's verse is there
  rotated_wide_shots: true    # allow the reference's sideways widescreen shot, at most one per reel

claude:
  model: "claude-opus-5-5"
  effort_write: "high"
  effort_review: "high"
  effort_qc: "medium"
  min_review_score: 8         # scripture fidelity and respect, 0-10
  min_qc_score: 7             # visual QC per shot, 0-10

fal:
  # Every model ID and field name is configurable. Run `gita-reels check-models` on your machine
  # to compare them against fal's live API schema before spending anything.
  keyframe_model: "fal-ai/nano-banana-2/edit"   # image model that takes character reference images
  keyframe_refs_field: "image_urls"
  refs_model: "fal-ai/nano-banana-2"             # text-to-image, used once to make character sheets
  video_models:                                  # tried in order; the next is used if one fails
    - id: "fal-ai/veo3.1/fast/image-to-video"
      price_per_second: 0.10
      durations: [4, 6, 8]
      duration_format: "{n}s"
      resolution: "720p"
      native_audio: true                         # keep the model's ambient sound as an SFX stem
  keyframe_price: 0.08
  daily_budget_usd: 15
  reel_budget_usd: 8
  max_retries_per_shot: 2
  poll_seconds: 5
  timeout_seconds: 900

publish:
  auto_publish: true           # autopilot uploads every reel that passes all automated checks
  privacy: "public"            # public | unlisted | private. YouTube keeps uploads private until your API project passes its audit
  platforms: ["youtube"]

paths:
  verses: "data/verses.json"
  style: "style"
  music: "music"               # licensed or royalty-free tracks; filename words are used as mood tags
  sfx: "sfx"
  out: "reels"
  cache: ".cache/fal"
  state: "reels_state.json"
