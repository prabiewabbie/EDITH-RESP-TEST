# Builds data/verses.json from public-domain sources (Sanskrit text and transliteration from the Unlicense
# gita/gita dataset; English from Annie Besant's translation on Wikisource). Run by hand from the Actions tab,
# or automatically when the importer changes on a claude/ branch. Commits the result to the branch it ran on.
name: import verses
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["gita_reels/verses_import.py", ".github/workflows/verses.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Discover source layout
        run: |
          curl -sS "https://en.wikisource.org/w/api.php?action=query&list=allpages&apprefix=Bhagavad-Gita%20(Besant%204th)&apnamespace=0&aplimit=100&format=json" | head -c 4000; echo
          curl -sS "https://en.wikisource.org/w/index.php?title=Bhagavad-Gita_(Besant_4th)&action=raw" | head -c 3000; echo
          curl -sS "https://en.wikisource.org/w/index.php?title=Bhagavad-Gita_(Besant_4th)/Discourse_2&action=raw" | head -c 6000; echo
