# Builds data/verses.json from public-domain sources (Sanskrit text and transliteration from the Unlicense
# gita/gita dataset; English from Annie Besant's translation on Wikisource). Run by hand from the Actions tab,
# or automatically when the importer changes on a claude/ branch. Commits the result to the branch it ran on.
name: import verses
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["gita_reels/verses_import.py", ".github/workflows/verses.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Discover source layout
        run: |
          curl -sS "https://en.wikisource.org/w/api.php?action=parse&page=Bhagavad-Gita_(Besant_4th)/Discourse_2&prop=text&format=json&formatversion=2" -o d2.json
          python3 - <<'PY'
          import json, re, html
          t = json.load(open("d2.json"))["parse"]["text"]
          i = t.find("action alone")
          if i < 0: i = t.find("fruit")
          print("HTML around:", t[max(0, i - 3000):i + 1500])
          txt = html.unescape(re.sub(r"<[^>]+>", "", t))
          j = txt.find("action alone")
          print("TEXT around:", txt[max(0, j - 1500):j + 800])
          PY
