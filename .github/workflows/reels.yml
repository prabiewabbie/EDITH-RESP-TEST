name: Gita Reels autopilot

on:
  schedule:
    - cron: "41 0 * * *"      # daily, 06:26 Nepal time: next episode -> reel -> YouTube
  workflow_dispatch:
    inputs:
      command:
        description: "autopilot | plan | make"
        default: "autopilot"
      episode:
        description: "Episode id for plan/make, e.g. e07 (blank = next in the storyline)"
        default: ""

concurrency:
  group: gita-reels
  cancel-in-progress: false

permissions:
  contents: write

env:
  STATE_BRANCH: reels-state

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation
          pip install -q -e ".[reels]"

      # Storyline position, spend ledger, character sheets and the fal result cache survive between runs.
      - name: Restore state
        run: |
          if git fetch -q origin "$STATE_BRANCH" 2>/dev/null; then
            git checkout "origin/$STATE_BRANCH" -- . 2>/dev/null || true
            git reset -q
          fi

      - name: Run
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          IN_CMD: ${{ inputs.command }}
          IN_EPISODE: ${{ inputs.episode }}
        run: |
          set -o pipefail
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$FAL_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY or FAL_KEY not set; skipping."; exit 0
          fi
          CMD="${IN_CMD:-autopilot}"
          case "$CMD" in autopilot|plan|make) ;; *) echo "unknown command $CMD"; exit 1 ;; esac
          ARGS=""
          if [ -n "$IN_EPISODE" ] && [ "$CMD" != "autopilot" ]; then
            case "$IN_EPISODE" in e[0-9][0-9]) ARGS="--episode $IN_EPISODE" ;; *) echo "bad episode id"; exit 1 ;; esac
          fi
          gita-reels -v $CMD $ARGS | tee -a "$GITHUB_STEP_SUMMARY"
          echo "folder=$(ls -td reels/*/ 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"

      # The whole editable project: raw + conformed clips, stems, titles, captions, timelines, final.mp4.
      - name: Upload editable project
        if: steps.run.outputs.folder != ''
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: ${{ steps.run.outputs.folder }}
          retention-days: 30

      - name: Save state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/state" && cd "$RUNNER_TEMP/state"
          git init -q && git checkout -q -b "$STATE_BRANCH"
          cd "$GITHUB_WORKSPACE"
          for p in reels_state.json reels/spend.json style/refs .cache/fal; do
            [ -e "$p" ] && mkdir -p "$RUNNER_TEMP/state/$(dirname "$p")" && cp -r "$p" "$RUNNER_TEMP/state/$p"
          done
          # keep each reel's project.json (plan, review, QC, cost) but not its media
          for f in reels/*/project.json; do
            [ -e "$f" ] && mkdir -p "$RUNNER_TEMP/state/$(dirname "$f")" && cp "$f" "$RUNNER_TEMP/state/$f"
          done
          cd "$RUNNER_TEMP/state"
          git add -A
          git -c user.name="gita-reels-bot" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "reels state" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$STATE_BRANCH"
